<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thesis Finder : 논문 검색하기</title>
    <!-- Vanta.js 요구 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.122/pdf.min.js" integrity="sha512-A2oFqbDkKxUR2TMEqN+gjc3jZu2xYdLTrq1Kq3j2NF0jmlpuU2RGmyAubXPMrEL76GRaVYxvZOUQ9Y6L0qPIaw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js" integrity="sha512-WG0Y20rQ9ZojP3pFMoHCqIhLYqmRkFz0qEbzwsQWUJ3TFpehLn1hTIDjlpq0wWnN9CPvhS8vQbM0r9mLEsU2QA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://unpkg.com/browser-image-compression@2.0.0/dist/browser-image-compression.js"></script>
    <style>
        /* Full dark mode base styles */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        body { color: #e6eef8; background: #071024; line-height: 1.6; position: relative; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* Vanta background kept but darkened */
        #vanta-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: linear-gradient(135deg, #071024 0%, #071024 100%); }

        .navbar { display: flex; justify-content: space-between; align-items: center; background: rgba(2,6,23,0.7); backdrop-filter: blur(6px); padding: 1rem 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.6); position: sticky; top: 0; z-index: 100; }
        .nav-brand { font-size: 1.25rem; font-weight: 700; color: #c7d2fe; cursor: pointer; }
        .nav-links button { margin-left: 1rem; padding: 0.5rem 1rem; border: none; background: transparent; cursor: pointer; font-size: 1rem; font-weight: 600; color: #9aa8bf; }
        .nav-links button:hover { color: #a78bfa; }
        .nav-links button.active { color: #a78bfa; border-bottom: 2px solid rgba(167,139,250,0.18); }

        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; position: relative; z-index: 1; }
        .section { display: none; animation: fadeIn 0.5s ease-in-out; }
        .section.active { display: block; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hero-search { text-align: center; padding: 3rem 0; }
        .hero-search h1 { font-size: 2rem; margin-bottom: 1rem; color: #eef2ff; text-shadow: 0 2px 8px rgba(0,0,0,0.6); }
        .search-box { display: flex; max-width: 600px; margin: 0 auto; gap: 0.5rem; border-radius: 8px; }
        .search-box input { flex: 1; padding: 0.9rem; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; font-size: 1rem; outline: none; background: rgba(255,255,255,0.03); color: #e6eef8; }
        .search-box button { padding: 0.9rem 1.6rem; background: linear-gradient(90deg,#7c3aed,#4f46e5); color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: opacity 0.15s; }
        .search-box button:hover { opacity: 0.95; }

        .results-layout { display: flex; gap: 2rem; margin-top: 2rem; }
        .sidebar { width: 260px; background: rgba(2,6,23,0.6); backdrop-filter: blur(6px); padding: 1.5rem; border-radius: 12px; box-shadow: 0 6px 20px rgba(2,6,23,0.6); height: fit-content; }
        .sidebar h3 { margin-bottom: 1rem; font-size: 1.05rem; border-bottom: 1px solid rgba(255,255,255,0.04); padding-bottom: 0.5rem; color: #cbd5e1; }
        .filter-group { margin-bottom: 1.5rem; }
        .filter-group label { display: block; margin-bottom: 0.5rem; cursor: pointer; color: #475569; }
        
        .results-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
        .paper-card { background: rgba(6, 10, 18, 0.6); padding: 1.2rem; border-radius: 12px; box-shadow: 0 6px 22px rgba(2,6,23,0.7); display: flex; flex-direction: column; transition: transform 0.2s; }
        .paper-card:hover { transform: translateY(-6px); }
        .paper-meta { font-size: 0.85rem; color: #9aa8bf; margin-bottom: 0.5rem; }
        .paper-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; color: #eef2ff; }
        .paper-abstract { font-size: 0.95rem; color: #b8c7db; margin-bottom: 1rem; flex-grow: 1; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
        .paper-link { margin-top: auto; display: inline-block; text-align: center; background: rgba(124,58,237,0.12); color: #c7b6ff; padding: 0.5rem; border-radius: 6px; font-weight: 700; transition: background 0.15s; }
        .paper-link:hover { background: rgba(124,58,237,0.18); }

        .toolbox-card { background: rgba(2,6,23,0.6); border-radius: 12px; box-shadow: 0 6px 22px rgba(2,6,23,0.7); overflow: hidden; margin-top: 2rem; }
        .tabs { display: flex; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tab-btn { flex: 1; padding: 1.2rem; text-align: center; border: none; background: transparent; cursor: pointer; font-size: 1.1rem; font-weight: 600; color: #9aa8bf; }
        .tab-btn.active { color: #a78bfa; border-bottom: 3px solid rgba(167,139,250,0.18); }
        .tab-content { padding: 2rem; display: none; }
        .tab-content.active { display: block; }

        .counter-layout { display: flex; gap: 2rem; }
        .text-area-wrapper { flex: 2; display: flex; flex-direction: column; gap: 1rem; }
        .text-area-wrapper textarea { width: 100%; height: 300px; padding: 1rem; border: 1px solid rgba(255,255,255,0.06); border-radius: 8px; resize: vertical; font-size: 1rem; outline: none; background: rgba(255,255,255,0.02); color: #e6eef8; }
        .text-area-wrapper textarea:focus { border-color: rgba(124,58,237,0.9); box-shadow: 0 4px 20px rgba(124,58,237,0.06); }
        .btn-group { display: flex; gap: 1rem; }
        .btn-group button { padding: 0.6rem 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: 700; }
        .btn-clear { background: rgba(255,255,255,0.03); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.04); }
        .btn-copy { background: linear-gradient(90deg,#06b6d4,#7c3aed); color: #fff; }
        .stats-panel { flex: 1; background: rgba(6,10,18,0.6); padding: 1.2rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03); height: fit-content; color: #dbeafe; }
        .stat-item { display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 1.05rem; color: #9aa8bf; }
        .stat-item strong { color: #a78bfa; font-size: 1.25rem; }

        .converter-upload { border: 2px dashed rgba(255,255,255,0.06); border-radius: 12px; padding: 3rem 2rem; text-align: center; background: rgba(255,255,255,0.02); cursor: pointer; margin-bottom: 1.5rem; position: relative; }
        .converter-upload input[type="file"] { position: absolute; width: 100%; height: 100%; top: 0; left: 0; opacity: 0; cursor: pointer; }
        .format-info { display: flex; justify-content: center; gap: 1rem; margin-top: 1rem; flex-wrap: wrap; }
        .format-badge { background: rgba(255,255,255,0.03); color: #dbeafe; padding: 0.45rem 0.9rem; border-radius: 20px; font-weight: 700; font-size: 0.9rem; }
        
        .loading { text-align: center; padding: 2rem; font-size: 1.1rem; color: #c7d2fe; display: none; }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 1rem;
            transform: translateX(-50%) translateY(10px);
            background: rgba(15, 23, 42, 0.95);
            color: #e2e8f8;
            border-radius: 999px;
            padding: 0.85rem 1.25rem;
            box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease, transform 0.2s ease;
            font-size: 0.95rem;
            z-index: 9999;
            max-width: 95%;
            text-align: center;
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #toast.error { background: rgba(220, 38, 38, 0.92); }
        #toast.success { background: rgba(16, 185, 129, 0.92); }
        #toast.info { background: rgba(59, 130, 246, 0.92); }

        /* 반응형 단순화 */
        @media (max-width: 768px) {
            .results-layout { flex-direction: column; }
            .sidebar { width: 100%; }
            .results-grid { grid-template-columns: 1fr; }
            .search-box { flex-direction: column; gap: 0.5rem; }
            .search-box button { width: 100%; }
        }
    </style>
</head>
<body>

    <div id="vanta-bg"></div>

    <nav class="navbar">
        <div class="nav-brand" onclick="switchPage('home')">🎓 Thesis Finder : 논문 검색하기</div>
        <div class="nav-links">
            <button class="nav-btn active" onclick="switchPage('home', this)">논문 검색</button>
            <button class="nav-btn" onclick="switchPage('toolbox', this)">문서 도구 (변환/글자수)</button>
        </div>
    </nav>
    <div id="toast"></div>

    <div class="container">
        <!-- 1. 논문 검색 페이지 -->
        <div id="home" class="section active">
            <div class="hero-search">
                <h1>어떤 주제의 논문이 필요하신가요?</h1>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="키워드를 입력하세요 (예: Artificial Intelligence)" onkeypress="if(event.key === 'Enter') performSearch()">
                    <button onclick="performSearch()">검색</button>
                </div>
            </div>

            <div id="loading" class="loading">실제 논문 데이터를 검색 중입니다... 🔍</div>

            <div id="searchResults" class="results-layout" style="display: none;">
                <aside class="sidebar">
                    <h3>상세 필터</h3>
                    <div class="filter-group">
                        <strong>정렬 기준</strong>
                        <label><input type="radio" name="sort" checked> 관련도순</label>
                    </div>
                    <div class="filter-group">
                        <strong>자료 출처</strong>
                        <label><input type="checkbox" checked disabled> Crossref (글로벌 API)</label>
                    </div>
                </aside>
                <div class="results-grid" id="paperGrid"></div>
            </div>
        </div>

        <!-- 2. 부기능 페이지 -->
        <div id="toolbox" class="section">
            <div class="toolbox-card">
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('converter', this)">문서 변환기</button>
                    <button class="tab-btn" onclick="switchTab('counter', this)">글자수 계산기</button>
                </div>

                <!-- 문서 변환기 -->
                <div id="converter" class="tab-content active">
                    <h2 style="margin-bottom: 1.5rem; text-align: center; color: #eef2ff;">파일을 브라우저에서 직접 변환하세요</h2>
                                    <div class="converter-upload" id="converterUpload">
                                        <input type="file" id="fileInput" onchange="handleFileUpload(this)">
                                        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9aa8bf" stroke-width="2" style="margin-bottom: 1rem;">
                                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                                        </svg>
                                        <p style="font-size: 1.05rem; color: #cbd5e1;">여기로 파일을 끌어다 놓거나 <strong>클릭하여 업로드</strong> 하세요.</p>
                                        <p style="font-size: 0.85rem; color: #94a3b8; margin-top: 0.5rem;" id="uploadStatus">브라우저 내 PDF 텍스트 추출, 이미지 압축, TXT → PDF 변환 지원</p>
                                    </div>
                                    <div class="format-info">
                                        <span class="format-badge">PDF → TXT / JSON</span>
                                        <span class="format-badge">PNG/JPG/WebP 압축</span>
                                        <span class="format-badge">TXT → PDF</span>
                                    </div>
                </div>

                <!-- 글자수 계산기 -->
                <div id="counter" class="tab-content">
                    <div class="counter-layout">
                        <div class="text-area-wrapper">
                            <textarea id="textInput" placeholder="여기에 텍스트를 입력하거나 붙여넣기 하세요..." oninput="calculateStats()"></textarea>
                            <div class="btn-group">
                                <button class="btn-clear" onclick="clearText()">초기화</button>
                                <button class="btn-copy" onclick="copyText()">전체 복사</button>
                            </div>
                        </div>
                        <div class="stats-panel">
                            <h3 style="margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem;">분량 요약</h3>
                            <div class="stat-item"><span>공백 포함</span><strong id="charWithSpace">0</strong></div>
                            <div class="stat-item"><span>공백 미포함</span><strong id="charNoSpace">0</strong></div>
                            <div class="stat-item"><span>단어 수</span><strong id="wordCount">0</strong></div>
                            <div class="stat-item"><span>줄 바꿈 수</span><strong id="lineCount">0</strong></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        VANTA.NET({ el: "#vanta-bg", mouseControls: true, touchControls: true, minHeight: 200.00, minWidth: 200.00, scale: 1.00, scaleMobile: 1.00, color: 0x87ceeb, backgroundColor: 0x0f172a, backgroundAlpha: 0.0 });

        function switchPage(pageId, btn) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            if(btn) { document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active')); btn.classList.add('active'); }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active')); btn.classList.add('active');
        }

        function calculateStats() {
            const text = document.getElementById('textInput').value;
            document.getElementById('charWithSpace').textContent = text.length;
            document.getElementById('charNoSpace').textContent = text.replace(/\s/g, '').length;
            document.getElementById('wordCount').textContent = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            document.getElementById('lineCount').textContent = text === '' ? 0 : text.split(/\n/).length;
        }
        function clearText() { document.getElementById('textInput').value = ''; calculateStats(); showToast('입력이 초기화되었습니다.', 'info'); }
        function copyText() { const text = document.getElementById('textInput'); text.select(); document.execCommand('copy'); showToast('복사되었습니다.', 'success'); }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = '';
            toast.classList.add(type);
            toast.classList.add('show');
            clearTimeout(toast.dismissTimeout);
            toast.dismissTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2600);
        }

        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.122/pdf.worker.min.js';
        }

        let localPapers = [];
        async function loadLocalPapers() {
            try {
                const response = await fetch('papers.json');
                if (response.ok) {
                    localPapers = await response.json();
                }
            } catch (error) {
                console.warn('Local papers load failed', error);
            }
        }

        window.addEventListener('DOMContentLoaded', loadLocalPapers);

        function searchLocalPapers(query) {
            const q = query.toLowerCase();
            return localPapers.filter(paper => {
                const text = [paper.title, paper.abstract, ...(paper.authors || [])].join(' ').toLowerCase();
                return text.includes(q);
            });
        }

        function renderSearchResults(items, grid) {
            items.forEach(paper => {
                const authors = (paper.authors || []).map(a => (typeof a === 'string' ? a : a.name)).join(', ') || 'Unknown Author';
                const abstract = paper.abstract || '초록이 제공되지 않는 논문입니다.';
                const venue = paper.venue || paper.publisher || paper.journal || '';
                const year = paper.year || paper.published || paper.issued || 'N/A';
                const url = paper.url || paper.paperUrl || paper.doi || '#';

                const card = `
                    <div class="paper-card">
                        <div class="paper-meta">${year} · ${authors} ${venue ? '· ' + venue : ''}</div>
                        <div class="paper-title">${paper.title}</div>
                        <div class="paper-abstract">${abstract}</div>
                        <a href="${url}" class="paper-link" target="_blank">원문 바로가기</a>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        async function fetchCrossrefPapers(query) {
            const response = await fetch(`https://api.crossref.org/works?query=${encodeURIComponent(query)}&rows=10`);
            if (!response.ok) {
                throw new Error('Crossref API unavailable');
            }
            const data = await response.json();
            return (data.message.items || []).map(item => ({
                title: (item.title && item.title[0]) || '제목 없음',
                authors: (item.author || []).map(author => [author.given, author.family].filter(Boolean).join(' ')),
                abstract: item.abstract ? item.abstract.replace(/<[^>]+>/g, '') : '',
                venue: (item['container-title'] && item['container-title'][0]) || item.publisher || '',
                year: item.issued && item.issued['date-parts'] && item.issued['date-parts'][0] ? item.issued['date-parts'][0][0] : 'N/A',
                doi: item.DOI ? `https://doi.org/${item.DOI}` : item.URL || '#',
            }));
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value;
            if (!query.trim()) { showToast('키워드를 입력해주세요.', 'error'); return; }

            document.getElementById('searchResults').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            const grid = document.getElementById('paperGrid');
            grid.innerHTML = '';

            let items = [];
            let source = '로컬';
            try {
                items = await fetchCrossrefPapers(query);
                source = 'Crossref';

                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchResults').style.display = 'flex';

                if (items && items.length > 0) {
                    showToast(`${source}에서 검색 결과를 불러왔습니다.`, 'success');
                    renderSearchResults(items, grid);
                    return;
                }

                const localItems = searchLocalPapers(query);
                if (localItems.length > 0) {
                    showToast('로컬 논문 데이터로 검색 결과를 표시합니다.', 'info');
                    renderSearchResults(localItems, grid);
                    return;
                }

                grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color:#cbd5e1;">검색 결과가 없습니다.</div>';
            } catch (error) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('searchResults').style.display = 'flex';
                const localItems = searchLocalPapers(query);
                if (localItems.length > 0) {
                    showToast('Crossref 요청 실패, 로컬 논문 데이터로 검색합니다.', 'info');
                    renderSearchResults(localItems, grid);
                } else {
                    grid.innerHTML = '<div style="grid-column: 1/-1; text-align:center; padding: 2rem; color:#fda4af;">논문 데이터를 불러오지 못했습니다.</div>';
                    showToast('Crossref 또는 로컬 논문 데이터가 없습니다.', 'error');
                }
            }
        }
        // 브라우저 변환 기능
        async function handleFileUpload(input) {
            const file = input.files[0];
            if (!file) return;

            const statusText = document.getElementById('uploadStatus');
            statusText.textContent = `${file.name} 준비 완료. 브라우저에서 직접 변환을 시도합니다.`;

            const ext = file.name.split('.').pop().toLowerCase();
            let targets = [];
            if (['png', 'jpg', 'jpeg', 'webp', 'gif'].includes(ext)) targets = ['compress'];
            else if (ext === 'pdf') targets = ['txt', 'json'];
            else if (ext === 'txt') targets = ['pdf'];
            else {
                const message = '이 브라우저 변환은 PDF, 이미지, TXT만 지원하며 HWP/HWPX는 지원되지 않습니다.';
                statusText.textContent = message;
                showToast(message, 'error');
                return;
            }

            const choice = await showConversionChoice(targets);
            if (!choice) {
                statusText.textContent = '변환 취소됨.';
                showToast('변환이 취소되었습니다.', 'info');
                return;
            }

            statusText.textContent = `변환 중... (${choice.toUpperCase()})`;
            try {
                if (choice === 'compress') {
                    const compressed = await compressImage(file);
                    const filename = file.name.replace(/\.[^.]+$/, '-compressed.' + ext);
                    downloadBlob(filename, compressed);
                    statusText.textContent = '이미지 압축 완료되었습니다.';
                    showToast('이미지 압축이 완료되었습니다.', 'success');
                } else if (choice === 'txt') {
                    const text = await extractPdfText(file);
                    downloadTextFile(file.name.replace(/\.pdf$/i, '.txt'), text);
                    statusText.textContent = 'PDF 텍스트 추출 완료되었습니다.';
                    showToast('PDF 텍스트 추출 완료되었습니다.', 'success');
                } else if (choice === 'json') {
                    const metadata = await extractPdfMetadata(file);
                    downloadTextFile(file.name.replace(/\.pdf$/i, '.json'), JSON.stringify(metadata, null, 2));
                    statusText.textContent = 'PDF 메타데이터 JSON 저장 완료되었습니다.';
                    showToast('PDF 메타데이터 JSON 저장 완료되었습니다.', 'success');
                } else if (choice === 'pdf') {
                    const text = await file.text();
                    const pdfBlob = await convertTextToPdf(text);
                    downloadBlob(file.name.replace(/\.txt$/i, '.pdf'), pdfBlob);
                    statusText.textContent = 'TXT → PDF 변환 완료되었습니다.';
                    showToast('TXT → PDF 변환이 완료되었습니다.', 'success');
                }
            } catch (error) {
                console.error(error);
                statusText.textContent = '브라우저 변환 중 오류가 발생했습니다.';
                showToast('브라우저 변환 중 오류가 발생했습니다.', 'error');
            }
        }

        function downloadBlob(filename, blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }

        function downloadTextFile(filename, text) {
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            downloadBlob(filename, blob);
        }

        async function compressImage(file) {
            const options = {
                maxSizeMB: 1,
                maxWidthOrHeight: 1920,
                useWebWorker: true,
            };
            return await imageCompression(file, options);
        }

        async function extractPdfText(file) {
            if (!window.pdfjsLib) {
                throw new Error('PDF.js 라이브러리가 로드되지 않았습니다.');
            }
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let text = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const pageText = content.items.map(item => item.str).join(' ');
                text += pageText + '\n\n';
            }
            return text.trim();
        }

        async function extractPdfMetadata(file) {
            if (!window.pdfjsLib) {
                throw new Error('PDF.js 라이브러리가 로드되지 않았습니다.');
            }
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            const metadata = await pdf.getMetadata().catch(() => ({}));
            return {
                title: metadata.info?.Title || 'Unknown',
                author: metadata.info?.Author || 'Unknown',
                subject: metadata.info?.Subject || '',
                keywords: metadata.info?.Keywords || '',
                producer: metadata.info?.Producer || '',
                creator: metadata.info?.Creator || '',
                creationDate: metadata.info?.CreationDate || '',
                modDate: metadata.info?.ModDate || '',
                pages: pdf.numPages,
            };
        }

        async function convertTextToPdf(text) {
            const pdfDoc = await PDFLib.PDFDocument.create();
            let page = pdfDoc.addPage();
            const font = await pdfDoc.embedFont(PDFLib.StandardFonts.Helvetica);
            const fontSize = 12;
            const pageWidth = page.getWidth() - 80;
            let y = page.getHeight() - 50;
            const lines = text.replace(/\r\n/g, '\n').split('\n');
            for (const line of lines) {
                const words = line.split(' ');
                let currentLine = '';
                for (const word of words) {
                    const testLine = currentLine ? `${currentLine} ${word}` : word;
                    const textWidth = font.widthOfTextAtSize(testLine, fontSize);
                    if (textWidth > pageWidth) {
                        page.drawText(currentLine, { x: 40, y, size: fontSize, font });
                        currentLine = word;
                        y -= fontSize + 4;
                        if (y < 50) {
                            page = pdfDoc.addPage();
                            y = page.getHeight() - 50;
                        }
                    } else {
                        currentLine = testLine;
                    }
                }
                page.drawText(currentLine, { x: 40, y, size: fontSize, font });
                y -= fontSize + 4;
                if (y < 50) {
                    page = pdfDoc.addPage();
                    y = page.getHeight() - 50;
                }
            }
            const pdfBytes = await pdfDoc.save();
            return new Blob([pdfBytes], { type: 'application/pdf' });
        }

        function showConversionChoice(targets) {
            return new Promise((resolve) => {
                const wrapper = document.createElement('div');
                wrapper.style.position = 'fixed';
                wrapper.style.left = 0; wrapper.style.top = 0; wrapper.style.right = 0; wrapper.style.bottom = 0;
                wrapper.style.display = 'flex'; wrapper.style.alignItems = 'center'; wrapper.style.justifyContent = 'center';
                wrapper.style.background = 'rgba(2,6,23,0.6)'; wrapper.style.zIndex = 9999;

                const box = document.createElement('div');
                box.style.background = '#071024'; box.style.padding = '1rem'; box.style.borderRadius = '8px'; box.style.minWidth = '260px';
                const title = document.createElement('div'); title.textContent = '변환할 형식을 선택하세요'; title.style.color = '#e6eef8'; title.style.marginBottom = '0.6rem';
                box.appendChild(title);

                targets.forEach(t => {
                    const btn = document.createElement('button'); btn.textContent = t.toUpperCase();
                    btn.style.margin = '0.3rem'; btn.style.padding = '0.5rem 0.8rem'; btn.style.border = 'none'; btn.style.borderRadius = '6px';
                    btn.style.cursor = 'pointer'; btn.style.background = 'linear-gradient(90deg,#7c3aed,#4f46e5)'; btn.style.color = '#fff';
                    btn.onclick = () => { document.body.removeChild(wrapper); resolve(t); };
                    box.appendChild(btn);
                });

                const cancel = document.createElement('button'); cancel.textContent = '취소';
                cancel.style.margin = '0.3rem'; cancel.style.padding = '0.5rem 0.8rem'; cancel.style.border = '1px solid rgba(255,255,255,0.06)'; cancel.style.borderRadius = '6px';
                cancel.style.background = 'transparent'; cancel.style.color = '#cbd5e1'; cancel.onclick = () => { document.body.removeChild(wrapper); resolve(null); };
                box.appendChild(cancel);

                wrapper.appendChild(box); document.body.appendChild(wrapper);
            });
        }
    </script>
